<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Monospace wie unter Windows 11 (Terminal): Cascadia Code (OFL) -->
  <alias binding="same">
    <family>Cascadia Mono</family>
    <accept><family>Cascadia Code</family></accept>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <accept><family>Cascadia Code</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cascadia Code</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
