<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Fenstra: Start-Symbol (helles Design) – das Fenstra-Logo ohne Kachel: Fensterrahmen,
       rechts Glas, linker Flügel nach außen geöffnet. Eigenes Motiv, CC-BY-SA-4.0. -->
  <defs>
    <linearGradient id="rahmen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A7FE8"/>
      <stop offset="1" stop-color="#0050B8"/>
    </linearGradient>
    <linearGradient id="fluegel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A9CFF"/>
      <stop offset="1" stop-color="#0058C8"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC2FF"/>
      <stop offset="1" stop-color="#3F98EC"/>
    </linearGradient>
  </defs>
  <!-- Rahmen -->
  <rect x="3.75" y="5.25" width="17.5" height="13.5" rx="2" fill="none" stroke="url(#rahmen)" stroke-width="1.5"/>
  <!-- rechter Flügel: Glas -->
  <rect x="12.25" y="6" width="8.25" height="12" rx="1" fill="url(#glas)"/>
  <!-- linker Flügel, nach außen geöffnet (perspektivisch höher) -->
  <path d="M3 5 11.5 1.5V22.5L3 19Z" fill="url(#fluegel)"/>
  <path d="M4.5 6.5 10 4.3V19.7L4.5 17.5Z" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
