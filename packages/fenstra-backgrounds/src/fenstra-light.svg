<?xml version="1.0" encoding="UTF-8"?>
<!-- Fenstra-Standardhintergrund (hell): weiche Farbverläufe, abstrakt. Eigenes Werk, CC-BY-SA-4.0.
     preserveAspectRatio="slice": beim Rendern in andere Seitenverhältnisse wird beschnitten, nicht verzerrt. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.55" stop-color="#EAF0FA"/>
      <stop offset="1" stop-color="#E9E2F6"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D8EF5" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#5FA8FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5FA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD2E6" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7FE0EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7FE0EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8F7BFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#B7A9FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#B7A9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="white" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <!-- große, weiche Farbflächen -->
  <ellipse cx="2450" cy="1250" rx="1500" ry="900" fill="url(#blue)" transform="rotate(-18 2450 1250)"/>
  <ellipse cx="1150" cy="1650" rx="1250" ry="700" fill="url(#teal)" transform="rotate(12 1150 1650)"/>
  <ellipse cx="3150" cy="500" rx="1100" ry="650" fill="url(#violet)" transform="rotate(-30 3150 500)"/>
  <ellipse cx="1500" cy="600" rx="1300" ry="600" fill="url(#white)" transform="rotate(-10 1500 600)"/>
  <!-- geschwungenes Band als Akzent -->
  <path d="M -200 1500 C 700 1050, 1500 1900, 2400 1350 S 3700 900, 4100 1250 L 4100 2400 L -200 2400 Z"
        fill="#FFFFFF" fill-opacity="0.22"/>
  <path d="M -200 1750 C 900 1350, 1700 2150, 2600 1650 S 3600 1250, 4100 1500 L 4100 2400 L -200 2400 Z"
        fill="#3D8EF5" fill-opacity="0.10"/>
</svg>
