<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Selawik ist Microsofts frei lizenzierter (OFL) Ersatz für Segoe UI mit
       gleichen Metriken. Anfragen nach "Segoe UI" (Wine, Webseiten, Programme)
       landen bei Selawik. -->
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Semibold</family>
    <accept><family>Selawik Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Light</family>
    <accept><family>Selawik Light</family></accept>
  </alias>
  <!-- Selawik als bevorzugte Sans-Schrift, Noto Sans als Ergänzung für Zeichen,
       die Selawik nicht hat (Selawik deckt Latein, Griechisch, Kyrillisch ab). -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Selawik</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
